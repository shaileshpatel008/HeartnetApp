apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'

android {
    compileSdk 35
//    buildToolsVersion '30.0.3'

    defaultConfig {
        applicationId "com.kavitultech.heartnetapp"
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true

        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["androidManifestFile": "$projectDir/src/main/AndroidManifest.xml".toString()]
            }
        }
    }
    buildTypes {
        release {
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        viewBinding true
    }
    namespace 'in.dibc.kavitul.drcardio'
    lint {
        abortOnError false
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.4.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.navigation:navigation-fragment:2.4.1'
    implementation 'androidx.navigation:navigation-ui:2.4.1'
    implementation 'androidx.activity:activity:1.8.0'
    testImplementation 'junit:junit:4.13.2'
    implementation 'com.google.android.material:material:1.6.1'
    implementation 'com.intuit.sdp:sdp-android:1.0.6'
    implementation project(path: ':appbluetoothmodule')
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
    implementation 'com.intuit.sdp:sdp-android:1.0.6'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    implementation platform('com.google.firebase:firebase-bom:28.1.0')
    implementation 'com.google.firebase:firebase-crashlytics:18.2.11'
    implementation 'com.google.firebase:firebase-analytics:21.0.0'

    implementation "androidx.core:core:1.15.0"

    implementation 'com.github.pwittchen:reactivenetwork-rx2:3.0.2'

    implementation 'com.itextpdf:kernel:7.2.5' // Latest stable version
    implementation 'com.itextpdf:itext7-core:7.2.5'
    implementation 'com.itextpdf:layout:7.2.5'  // Required for TextAlignment and layout features
    implementation 'com.squareup.picasso:picasso:2.8'  // Load images (GIF, signature)

    implementation 'com.android.support:multidex:2.0.1'

    implementation 'com.google.code.gson:gson:2.8.6'

    implementation 'com.android.volley:volley:1.2.1'

    //viewPager2 library
//    implementation 'androidx.viewpager2:viewpager2:1.1.0-beta02'

    //stepper library
//    implementation "com.tbuonomo:dotsindicator:5.0"

    //dexter permissions
    implementation "com.karumi:dexter:6.2.3"

    implementation 'com.github.dhaval2404:imagepicker:2.1'

    implementation 'com.saadahmedev.popup-dialog:popup-dialog:1.0.5'

    // circular imageview
    implementation 'com.mikhaellopez:circularimageview:4.3.1'

    implementation 'com.williamww:silky-signature:0.0.6'

//    implementation 'org.honorato.multistatetogglebutton:multistatetogglebutton:0.2.2'

    implementation 'com.github.davidmigloz:multi-state-switch:2.0.1'

//    implementation  'io.ak1:bubbletabbar:1.0.8'

    implementation 'com.github.simformsolutions:SSCustomBottomNavigation:3.6'

//    implementation 'np.com.susanthapa:curved_bottom_navigation:0.6.5'

    implementation 'pl.bclogic:pulsator4droid:1.0.3'


//    implementation 'com.github.barteksc:android-pdf-viewer:2.7.0'

    implementation 'com.github.iamyashchouhan:AndroidPdfViewer:1.0.3'

    implementation 'org.androidannotations:androidannotations-api:4.6.0'
    annotationProcessor "org.androidannotations:androidannotations:4.6.0"

//    implementation 'com.gauravk.bubblenavigation:bubblenavigation:1.0.7'

    implementation 'com.gauravbhola.ripplepulsebackground:library:1.0.0'

    implementation 'io.github.afreakyelf:Pdf-Viewer:2.1.1'

//    implementation 'com.kuassivi.android.view:ripple-pulse-layout:0.1.9'

    implementation 'com.codemybrainsout.onboarding:onboarder:1.0.4'

    implementation 'com.google.android.play:app-update:2.1.0'

    //Glide
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

// Optional (if you really need OkHttp)
    implementation 'com.github.bumptech.glide:okhttp3-integration:4.16.0'
    implementation 'com.github.chrisbanes:PhotoView:2.3.0'

    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.9.3'

    implementation 'com.github.yalantis:ucrop:2.2.8'
}
